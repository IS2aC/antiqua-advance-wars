# WebSocket : « Connection: upgrade » seulement quand le client le demande.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Fichiers produits par Vite, avec une empreinte dans le nom (garde-DQ075-hJ.css) :
  # leur contenu ne change jamais, on peut les garder en cache un an.
  location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Combats dessinés : le manifeste est revalidé ; les images portent son empreinte
  # (?v=…) et changent d'adresse quand elles changent : cache d'un an.
  location = /assets/combat-hd/manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location /assets/combat-hd/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Atlas et images de la page de garde : noms fixes, ils changent à chaque build d'assets.
  # Le navigateur les revalide (réponse 304 quand rien n'a changé).
  location /assets/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Manifeste de l'application installée (écran d'accueil) : type absent de mime.types.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /fonts/ {
    expires 30d;
    try_files $uri =404;
  }

  # API des comptes et WebSocket de présence : service « server » du docker-compose.
  # Résolution à la requête (DNS interne de Docker) : Nginx démarre même sans le serveur
  # (image seule, `docker build -t antiqua .`), et /api répond alors 502.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://server:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # Pages : toujours revalidées, pour qu'un déploiement soit visible tout de suite.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
