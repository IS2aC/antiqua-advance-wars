server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Fichiers produits par Vite, avec une empreinte dans le nom (garde-DQ075-hJ.css) :
  # leur contenu ne change jamais, on peut les garder en cache un an.
  location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Atlas et images de la page de garde : noms fixes, ils changent à chaque build d'assets.
  # Le navigateur les revalide (réponse 304 quand rien n'a changé).
  location /assets/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /fonts/ {
    expires 30d;
    try_files $uri =404;
  }

  # Pages : toujours revalidées, pour qu'un déploiement soit visible tout de suite.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
