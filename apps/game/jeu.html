<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alkébulan — Rise of Kingdoms</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/garde/icones/favicon-32.png" />
    <link rel="apple-touch-icon" href="./assets/garde/icones/apple-touch-icon.png" />
    <!-- iPhone : écran d'accueil sans barre du navigateur (le jeu gère les marges d'encoche). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alkébulan" />
    <!-- Police de l'interface des combats dessinés (prototype). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    />
    <style>
      /* Police pixel m5x7 (Daniel Linssen) : public/fonts/m5x7.ttf. Absente → monospace. */
      @font-face {
        font-family: 'm5x7';
        src: url('./fonts/m5x7.ttf') format('truetype');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1410;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Zone du jeu : tout l'écran visible (100dvh : sans la barre d'adresse des téléphones),
         moins l'encoche et les coins arrondis (src/ui/screen.ts lit ces marges). */
      #game {
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
        /* Le jeu gère lui-même les gestes : pas de zoom ni de défilement de la page. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* Téléphone en portrait : le jeu se joue en paysage. */
      #tourner {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #game {
          visibility: hidden;
        }
        #tourner {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 20px;
          padding: 24px;
          text-align: center;
          color: #f6ead2;
          font:
            600 18px/1.4 system-ui,
            sans-serif;
        }
        #tourner svg {
          width: 72px;
          height: 72px;
          stroke: #f5a623;
          fill: none;
          stroke-width: 1.6;
          stroke-linecap: round;
          stroke-linejoin: round;
          animation: tourner 2.4s ease-in-out infinite;
        }
      }
      @keyframes tourner {
        0%,
        30% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #tourner svg {
          animation: none;
          transform: rotate(-90deg);
        }
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="tourner" role="alert">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="2" width="12" height="20" rx="2" />
        <path d="M10.5 18.5h3" />
      </svg>
      <p>Tourne ton téléphone :<br />Alkébulan se joue en paysage.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
